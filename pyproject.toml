[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "botty-desktop"
version = "0.2.0.1"
description = "Botty Desktop - Asistente con IA local, expresiones, voz y memoria"
authors = [{name = "Botty"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pygame-ce>=2.5.0",
    "Pillow>=10.0.0",
    "mss>=9.0.0",
    "pytesseract>=0.3.10",
]

[project.optional-dependencies]
voice = ["SpeechRecognition>=3.10.0", "edge-tts>=6.1.0"]
microphone = ["PyAudio>=0.2.14"]
local-ai = ["llama-cpp-python>=0.2.90"]
dev = ["pytest>=7.0.0", "pyinstaller>=6.0.0", "edge-tts>=6.1.0"]

[project.scripts]
botty = "botty.__main__:main"

[tool.setuptools.packages.find]
include = ["botty*"]
